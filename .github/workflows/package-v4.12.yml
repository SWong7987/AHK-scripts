name: Package v4.12 experimental

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload AHK
        uses: actions/upload-artifact@v4
        with:
          name: AcademicGames_Equations_v4.12_EXPERIMENTAL
          path: AcademicGames_Equations/AcademicGames_Equations.ahk
          if-no-files-found: error
