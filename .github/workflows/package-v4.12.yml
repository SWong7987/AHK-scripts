name: Package v4.12 experimental

on:
  push:
    branches:
      - bot/v4.12-strategy-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload AHK
        uses: actions/upload-artifact@v4
        with:
          name: AcademicGames_Equations_v4.12_EXPERIMENTAL
          path: AcademicGames_Equations/AcademicGames_Equations.ahk
          if-no-files-found: error
