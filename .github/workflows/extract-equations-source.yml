name: Finalize EQUATIONS raw source

on: [push]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat AcademicGames_Equations/.transfer/part00.b64 \
              AcademicGames_Equations/.transfer/part01.b64 \
              AcademicGames_Equations/.transfer/part02.b64 \
              AcademicGames_Equations/.transfer/part03.b64 \
            | base64 -d > /tmp/equations-source.gz
          gzip -dc /tmp/equations-source.gz > AcademicGames_Equations/AcademicGames_Equations.ahk 2>/dev/null || true
          actual="$(sha256sum AcademicGames_Equations/AcademicGames_Equations.ahk | awk '{print $1}')"
          expected="22c701562164b3aa8782e2299ac39cdd9e5a00566d9e2823e5270a2dae1aeb48"
          test "$actual" = "$expected"
          test "$(wc -c < AcademicGames_Equations/AcademicGames_Equations.ahk)" -eq 97253

      - name: Clean temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AcademicGames_Equations/.transfer
          rm -f AcademicGames_Equations/AcademicGames_Equations_v4.4.zip
          rm -f .github/workflows/extract-equations-source.yml

      - name: Commit canonical raw source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Track Academic Games EQUATIONS as raw AutoHotkey source"
          git push origin main
